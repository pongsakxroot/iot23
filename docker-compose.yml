version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: promptpay-db
    environment:
      POSTGRES_USER: promptpay
      POSTGRES_PASSWORD: promptpay123
      POSTGRES_DB: payment_verification
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptpay"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promptpay-network

  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: promptpay-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    command: mosquitto -c /mosquitto-no-auth.conf
    networks:
      - promptpay-network

  # FastAPI Backend
  api:
    build: .
    container_name: promptpay-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://promptpay:promptpay123@postgres:5432/payment_verification
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      API_KEY: ${API_KEY:-secure-api-key-change-me}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-secure-webhook-secret-change-me}
      LINE_NOTIFY_TOKEN: ${LINE_NOTIFY_TOKEN:-}
      LINE_NOTIFY_ENABLED: ${LINE_NOTIFY_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - promptpay-network

  # IMAP Worker
  worker:
    build: .
    container_name: promptpay-worker
    command: python -u worker/imap_worker.py
    environment:
      DATABASE_URL: postgresql://promptpay:promptpay123@postgres:5432/payment_verification
      WEBHOOK_URL: http://api:8000/webhook/bank-notification
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-secure-webhook-secret-change-me}
      IMAP_SERVER: ${IMAP_SERVER:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_EMAIL: ${IMAP_EMAIL}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_POLL_INTERVAL: ${IMAP_POLL_INTERVAL:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    depends_on:
      - api
    networks:
      - promptpay-network
    # Comment out if IMAP credentials are not configured
    profiles:
      - with-worker

networks:
  promptpay-network:
    driver: bridge

volumes:
  postgres_data:
